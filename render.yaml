services:
  - type: web
    name: arcana
    runtime: node
    plan: free
    branch: master
    buildCommand: python3 -m venv venv && ./venv/bin/python -m pip install --upgrade pip && ./venv/bin/python -m pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm run start -- -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VERTEX_PROJECT
        value: ieor-4576-487001
      - key: VERTEX_LOCATION
        value: us-central1
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/google-credentials.json
